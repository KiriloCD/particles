<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>HSHG Optimized</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0e0e0e; color: #fff; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.8); padding: 15px;
            border-radius: 8px; border: 1px solid #444;
            pointer-events: none; width: 250px;
        }
        .stat { margin-bottom: 8px; display: flex; justify-content: space-between; }
        .val { color: #00ff00; font-family: monospace; font-weight: bold; }
        .hint { font-size: 11px; color: #888; margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">Об'єктів: <span id="count" class="val">0</span></div>
    <div class="stat">FPS: <span id="fps" class="val">0</span></div>
    <div class="stat">Перевірок пар: <span id="checks" class="val">0</span></div>
    <div class="stat">К-сть сіток: <span id="grids" class="val">0</span></div>
    <div class="hint">
        Клік: +500 об'єктів<br>
        Пробіл: Очистити сцену
    </div>
</div>

<canvas id="world"></canvas>

<script src="hshg.js"></script>
<script>

class Ball {
    constructor(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = r;
        
        
        this.aabbMinX = 0;
        this.aabbMinY = 0;
        this.aabbMaxX = 0;
        this.aabbMaxY = 0;
        
        const speed = 30 + Math.random() * 100;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.color = `hsl(${Math.random() * 360}, 60%, 50%)`;
        
        
        this.updateAABB();
    }

    
    updateAABB() {
        this.aabbMinX = this.x - this.r;
        this.aabbMinY = this.y - this.r;
        this.aabbMaxX = this.x + this.r;
        this.aabbMaxY = this.y + this.r;
    }

    update(dt, w, h) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        
        if (this.x - this.r < 0) { this.x = this.r; this.vx *= -1; }
        if (this.x + this.r > w) { this.x = w - this.r; this.vx *= -1; }
        if (this.y - this.r < 0) { this.y = this.r; this.vy *= -1; }
        if (this.y + this.r > h) { this.y = h - this.r; this.vy *= -1; }

        
        this.updateAABB();
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const hshg = new HSHG({
    initialGridLength: 16384,
    hierarchyFactor: 2
});
const balls = [];

let checksCounter = 0;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function spawn(count) {
    for (let i = 0; i < count; i++) {
        const r = 2 + Math.random() * 8; 
        const ball = new Ball(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            r
        );
        balls.push(ball);
        hshg.addObject(ball);
    }
    document.getElementById('count').innerText = balls.length;
}

function handleCollision(a, b) {
    checksCounter++;
    
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    
    
    const distSq = dx*dx + dy*dy;
    const minDist = a.r + b.r;
    const minDistSq = minDist * minDist;

    if (distSq < minDistSq) {
        
        const distance = Math.sqrt(distSq);
        
       
        if (distance === 0) return;

        const nx = dx / distance;
        const ny = dy / distance;
        const overlap = minDist - distance;

       
        a.x -= nx * (overlap * 0.5);
        a.y -= ny * (overlap * 0.5);
        b.x += nx * (overlap * 0.5);
        b.y += ny * (overlap * 0.5);
        
        
        a.updateAABB();
        b.updateAABB();

        // Фізика відскоку
        const rvx = a.vx - b.vx;
        const rvy = a.vy - b.vy;
        const velAlongNormal = rvx * nx + rvy * ny;

        if (velAlongNormal > 0) {
            a.vx -= velAlongNormal * nx;
            a.vy -= velAlongNormal * ny;
            b.vx += velAlongNormal * nx;
            b.vy += velAlongNormal * ny;
        }
    }
}

let lastTime = 0;
let fpsFrames = 0;
let fpsLastTime = 0;

function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.016);
    lastTime = now;

    for (const ball of balls) ball.update(dt, canvas.width, canvas.height);
    
    hshg.update();

    checksCounter = 0;
    hshg.queryForCollisionPairs(handleCollision);

    ctx.fillStyle = '#0e0e0e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Візуалізація сітки (перший шар)
    /*
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    if (hshg._grids[0]) {
        const size = hshg._grids[0].cellSize;
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += size) {
             ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y < canvas.height; y += size) {
             ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
    }
    */

    for (const ball of balls) ball.draw(ctx);

    updateStats(now);
    requestAnimationFrame(loop);
}

function updateStats(now) {
    fpsFrames++;
    if (now - fpsLastTime > 1000) {
        document.getElementById('fps').innerText = fpsFrames;
        document.getElementById('checks').innerText = checksCounter;
        document.getElementById('grids').innerText = hshg._grids.length;
        fpsFrames = 0;
        fpsLastTime = now;
    }
}

window.addEventListener('resize', resize);
window.addEventListener('mousedown', () => spawn(500));
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        while(balls.length > 0) hshg.removeObject(balls.pop());
        document.getElementById('count').innerText = 0;
    }
});

resize();
spawn(2000); 
requestAnimationFrame(loop);

</script>
</body>
</html>
